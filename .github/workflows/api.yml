name: api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "deploy/docker/api.Dockerfile", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", "deploy/docker/api.Dockerfile", ".github/workflows/api.yml"]

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      DATABASE_DIRECT_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api
      - run: go vet ./...
      - run: go test -race ./...
      - name: OpenAPI spec is up to date
        run: |
          go run ./cmd/relay openapi > openapi/openapi.json
          git diff --exit-code -- openapi/openapi.json

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
