name: web

on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/**",
        "apps/crm/**",
        "packages/**",
        "pnpm-lock.yaml",
        "biome.json",
        "deploy/docker/web.Dockerfile",
        ".github/workflows/web.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/**",
        "apps/crm/**",
        "packages/**",
        "pnpm-lock.yaml",
        "biome.json",
        "deploy/docker/web.Dockerfile",
        ".github/workflows/web.yml",
      ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: API client is up to date
        run: |
          pnpm --filter @relay/api-client gen
          git diff --exit-code -- packages/api-client
      - run: pnpm typecheck
      - run: pnpm --filter @relay/web build
      - run: pnpm --filter @relay/crm build

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
