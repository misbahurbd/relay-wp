version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries:
      - ../internal/features/auth/repository/
      - ../internal/features/profiles/repository/
      - ../internal/features/workspaces/repository/
      - ../internal/features/onboarding/repository/
      - ../internal/features/whatsapp/repository/
      - ../internal/features/team/repository/
      - ../internal/features/billing/repository/
      - ../internal/features/contacts/repository/
      - ../internal/features/templates/repository/
      - ../internal/features/integrations/repository/
      - ../internal/features/inbox/repository/
      - ../internal/features/automations/repository/
      - ../internal/features/broadcasts/repository/
    gen:
      go:
        package: gen
        out: gen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
