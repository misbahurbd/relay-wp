version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - wrapcheck
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/misbahurbd/relay-wp/apps/api/*
  exclusions:
    generated: strict
    paths:
      - db/gen
    rules:
      # Tests return errors straight from the code under test; wrapping adds noise.
      - path: _test\.go
        linters: [wrapcheck]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/misbahurbd/relay-wp/apps/api
